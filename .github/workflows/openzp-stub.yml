name: openzp-stub
# e2e-only: identical to the production workflow (same step code, same inputs, same
# secrets, same validation) EXCEPT the launched instance runs a wait+marker stub
# instead of itworker, and the statement is forced isTest=true. Keeping the inputs and
# secrets in lockstep is the point: a green stub run proves the production run's
# config would pass too, and tests/test_workflows.py fails if the two files drift. The
# lone deliberate divergence is skip_domain's default (the stub buys nothing, so
# reusing a domain is the sane default). Its attestation is signed as coming from THIS
# workflow file — which is also why the two files are not merged into one reusable
# workflow: that would sign stub and production under the same identity, and
# so `gh attestation verify --predicate-type ... ` for the production workflow will
# never accept a stub-produced statement. Use it to exercise the workflow's own logic
# without a real platform bring-up.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "audit window start (Unix timestamp, seconds since epoch)"
        required: true
      end:
        description: "audit window end (Unix timestamp, seconds). Must be within ~4h of trigger (6h job cap)."
        required: true
      domain:
        description: "domain (recorded in the statement; not registered by the stub)"
        required: true
      contact:
        description: 'domain registration contact, JSON: {"FirstName","LastName","AddressLine1","City","State","CountryCode","ZipCode","PhoneNumber","Email"}'
        required: true
      skip_domain:
        description: "reuse an already-owned domain instead of buying (forces isTest=true)"
        type: boolean
        default: true

permissions:
  id-token: write
  attestations: write
  contents: read

jobs:
  bootstrap-and-attest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # TODO(repo-split): pin these actions to full commit SHAs.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install boto3
      - name: run steps 1-8 (stub itworker)
        env:
          OPENZP_STUB: "1"
          OPENZP_ROOT_KEY: ${{ secrets.ROOT_KEY_ID }}
          OPENZP_ROOT_SECRET: ${{ secrets.ROOT_SECRET }}
          OPENZP_API_KEY: ${{ secrets.CONTROL_API_KEY }}
          OPENZP_START: ${{ inputs.start }}
          OPENZP_END: ${{ inputs.end }}
          OPENZP_DOMAIN: ${{ inputs.domain }}
          OPENZP_CONTACT: ${{ inputs.contact }}
          OPENZP_SKIP_DOMAIN: ${{ inputs.skip_domain }}
        run: python -m openzp_workflow
      - name: sign statement
        uses: actions/attest@v1
        with:
          subject-path: statement.json
          predicate-type: https://openzp.dev/verifiable-deployment/v1
          predicate-path: statement.json
      - uses: actions/upload-artifact@v4
        with:
          name: openzp-statement-stub
          path: statement.json
